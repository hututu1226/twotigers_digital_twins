[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huawei-scheme-a-spatial-inpainting"
version = "0.1.0"
description = "Angle-delay latent spatial inpainting for Huawei Round 2 channel generation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["spatial_inpainting*"]
