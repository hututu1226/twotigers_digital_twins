[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huawei-scheme-f-query-adaptive-operator-fusion"
version = "0.1.0"
description = "Query-adaptive sparse latent transport with full-resolution neural operators"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scheme_f*"]
