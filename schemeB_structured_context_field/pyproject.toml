[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huawei-scheme-b-structured-context-field"
version = "0.1.0"
description = "Structured angle-delay autoencoder with a gated context field for Huawei Round 2"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["structured_context_field*"]
